[platformio]
default_envs = uart

; Reference profile: ESP32-S3-DevKitC-1 N8, no PSRAM used.
; Confirm the actual board before uploading.
[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
build_flags =
    -D OLED_HEIGHT=64

; USB connector marked UART/COM (USB-to-serial bridge).
[env:uart]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Native USB connector marked USB/OTG.
[env:usb]
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
